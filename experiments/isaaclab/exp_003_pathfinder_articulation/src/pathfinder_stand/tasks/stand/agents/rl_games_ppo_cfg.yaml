params:
  seed: 42

  env:
    clip_observations: 10.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -1.0
        fixed_sigma: true
    mlp:
      units: [128, 128]
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: false
  load_path: ""

  config:
    name: PathfinderStand
    env_name: rlgpu
    device: "cuda:0"
    device_name: "cuda:0"
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 3.0e-4
    lr_schedule: adaptive
    kl_threshold: 0.008
    score_to_win: 500.0
    max_epochs: 500
    save_best_after: 25
    save_frequency: 25
    grad_norm: 1.0
    entropy_coef: 0.005
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 32
    mini_epochs: 4
    critic_coef: 2.0
    clip_value: true
    seq_length: 4
    bounds_loss_coef: 0.0001


