# 実験そのものに関するメタ情報
experiment:
  # 実験ID。
  # 他の実験と区別するための一意な名前です。
  id: exp_001_gravity_sweep

  # 乱数シード。
  # 同じ乱数シードを使うことで、乱数を使う実験を再現しやすくします。
  # 今回の実験ではまだ乱数をほぼ使いませんが、今後のために残しておきます。
  seed: 42


# シミュレーション全体の設定
simulation:
  # シミュレーション内部の1ステップあたりの時間。
  # 単位は秒です。
  # 0.002秒なので、1秒あたり500ステップ進みます。
  # 小さくするほど物理計算は細かくなりますが、計算量は増えます。
  timestep: 0.002

  # 各条件を何秒間シミュレーションするか。
  # 単位は秒です。
  # 今回は球が床へ落下するまで十分な長さとして5秒にしています。
  duration_seconds: 5.0

  # 球の初期位置の高さ。
  # MuJoCoの通常の長さ単位はメートルです。
  # 床面を z=0 としたとき、球の中心を高さ2mから開始します。
  initial_height: 2.0


# 実験で変更する条件
conditions:
  # 重力加速度の候補。
  # 値は重力の大きさで、単位は m/s^2 です。
  # run.pyでは、この値をZ軸の負方向へ設定します。
  gravity:
    # 地球表面付近の標準重力加速度
    earth: 9.80665

    # 火星表面付近の重力加速度
    mars: 3.71

    # 月面付近の重力加速度
    moon: 1.62


# 実験結果として記録する指標
metrics:
  # 球が最初に床へ接触したシミュレーション時刻。
  # 単位は秒です。
  - impact_time

  # 球が最初に床へ接触する直前付近の鉛直速度。
  # 単位は m/s です。
  # 下向きを負として扱う実装の場合、負の値になります。
  - impact_velocity

  # シミュレーション中に観測された最大速度。
  # 現在のrun.pyでは、鉛直方向の速度の絶対値を記録します。
  # 単位は m/s です。
  - maximum_speed